        <a class="navbar-brand fw-bold" href="index.html"> Transcent </a>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li class="nav-item">

    <main class="auth-page">
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <span class="auth-eyebrow">Join the Community</span>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">
              Experience thoughtfully curated beauty crafted for you.
            </p>
          </div>

          <form id="registerForm" method="POST">
            <div class="form-group">
              <label class="form-label" for="registerName">Full Name</label>
              <input
                type="text"
                id="registerName"
                class="form-input"
                placeholder="Manas Maydeo"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <input
                type="email"
                id="registerEmail"
                class="form-input"
                placeholder="manas@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="registerPassword">Password</label>
              <input
                type="password"
                id="registerPassword"
                class="form-input"
                placeholder="At least 8 characters"
                minlength="8"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword"
                >Confirm Password</label
              >
              <input
                type="password"
                id="confirmPassword"
                class="form-input"
                placeholder="Repeat your password"
                minlength="8"
                required
              />
            </div>

            <div class="form-row">
              <label class="form-check">
                <input type="checkbox" id="agreeTerms" required />
                <span>I agree to the Terms of Service &amp; Privacy Policy</span>
              </label>
            </div>

            <button type="submit" class="btn-auth">Create Account →</button>
            <div id="registerMessage" class="text-center mt-3" style="color: #fff; font-size: 0.9rem;"></div>
          </form>

          <div class="auth-footer">
            Already have an account?
            <a href="login.html">Sign in</a>
          </div>
        </div>
      </div>
    </main>
